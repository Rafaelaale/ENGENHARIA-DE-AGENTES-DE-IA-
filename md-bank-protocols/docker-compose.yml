version: '3.8'

services:
  abrir_conta_agent:
    build:
      context: ./agents/abrir_conta
      dockerfile: Dockerfile
    container_name: abrir_conta_agent
    ports:
      - "8081:8000"
    environment:
      - OPENAI_API_KEY=ollama
      - OPENAI_API_BASE=http://host.docker.internal:11434/v1
      - MODEL_NAME=llama3.2:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cartao_credito_agent:
    build:
      context: ./agents/cartao_credito
      dockerfile: Dockerfile
    container_name: cartao_credito_agent
    ports:
      - "8082:8000"
    environment:
      - OPENAI_API_KEY=ollama
      - OPENAI_API_BASE=http://host.docker.internal:11434/v1
      - MODEL_NAME=llama3.2:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"

  supervisor:
    build:
      context: ./supervisor
      dockerfile: Dockerfile
    container_name: mdbank_supervisor_agents
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=ollama
      - OPENAI_API_BASE=http://host.docker.internal:11434/v1
      - MODEL_NAME=llama3.2:latest
      - ABRIR_CONTA_URL=http://abrir_conta_agent:8000
      - CARTAO_CREDITO_URL=http://cartao_credito_agent:8000
    depends_on:
      - abrir_conta_agent
      - cartao_credito_agent
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mdbank_frontend
    ports:
      - "9090:9090"
    depends_on:
      - supervisor

  bfa:
    build:
      context: ./bfa
      dockerfile: Dockerfile
    container_name: bfa
    ports:
      - "8083:8083"
    volumes:
      - ./bfa:/app
    depends_on:
      - recursos
      - supervisor
      - abrir_conta_agent
      - cartao_credito_agent
  recursos:
    container_name: recursos
    build:
      context: ./recursos
    volumes:
      - ./recursos:/app
    ports:
      - "8084:8000"

  frontend-ag-ui:
    build: ./front-end2
    container_name: frontend-ag-ui
    ports:
      - "3000:3000"
    volumes:
      - ./front-end2:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
    command: npm start

